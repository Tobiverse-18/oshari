{% load static %}

<div class="newsletter-popup-overlay" id="newsletterPopup">

    <div class="newsletter-popup">

        <button
            type="button"
            class="newsletter-popup-close"
            id="newsletterClose"
            aria-label="Close newsletter popup"
        >
            <i data-lucide="x"></i>
        </button>

        <div class="newsletter-popup-content">

            <span class="newsletter-popup-label">
                OSHARI ITNS
            </span>

            <h2>
                Stay in the loop.
            </h2>

            <p>
                Be the first to know about new drops, exclusive pieces
                and important Oshari updates.
            </p>

            <form id="newsletterPopupForm">

                {% csrf_token %}

                <div class="newsletter-input-wrapper">

                    <input
                        type="email"
                        id="newsletterPopupEmail"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="newsletter-popup-submit"
                >
                    Subscribe
                </button>

            </form>

            <p
                class="newsletter-popup-message"
                id="newsletterPopupMessage"
                role="status"
            ></p>

            <label class="newsletter-dont-remind">

                <input
                    type="checkbox"
                    id="newsletterDontRemind"
                >

                <span>
                    Don't remind me again
                </span>

            </label>

        </div>

    </div>

</div>

<script src="{% static 'js/newsletter.js' %}"></script>
