{% load static %}

<aside class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <a href="{% url 'dashboard' %}" class="logo">

            <img src="{% static 'images/logo.png' %}" alt="OSHARI">

            <div>

                <h2>OSHARI</h2>

                <span>Dashboard</span>

            </div>

        </a>

    </div>

    <nav class="sidebar-menu">

        <a href="{% url 'dashboard' %}" class="menu-item">

            <div class="menu-left">

                <span class="icon">🏠</span>

                <span>Dashboard</span>

            </div>

        </a>

        <a href="{% url 'dashboard_products' %}" class="menu-item">

            <div class="menu-left">

                <span class="icon">🛍️</span>

                <span>Products</span>

            </div>

        </a>

        <a href="{% url 'dashboard_orders' %}" class="menu-item has-badge">

            <div class="menu-left">

                <span class="icon">🛒</span>

                <span>Orders</span>

            </div>

            {% if new_orders > 0 %}
            <span class="sidebar-badge">

                {{ new_orders }}

            </span>
            {% endif %}

        </a>

        <a href="{% url 'dashboard_newsletter' %}" class="menu-item has-badge">

            <div class="menu-left">

                <span class="icon">✉️</span>

                <span>Newsletter</span>

            </div>

            {% if new_subscribers > 0 %}
            <span class="sidebar-badge">

                {{ new_subscribers }}

            </span>
            {% endif %}

        </a>

        <a href="{% url 'dashboard_contacts' %}" class="menu-item has-badge">

            <div class="menu-left">

                <span class="icon">💬</span>

                <span>Contacts</span>

            </div>

            {% if new_messages > 0 %}
            <span class="sidebar-badge">

                {{ new_messages }}

            </span>
            {% endif %}

        </a>

    </nav>

    <div class="sidebar-footer">

        <a href="{% url 'home' %}" class="visit-site">

            🌐 Visit Website

        </a>

        <a href="{% url 'dashboard_logout' %}" class="logout-btn">

            🚪 Logout

        </a>

    </div>

</aside>
