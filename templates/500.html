<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | OSHARI ITNS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:"Inter",sans-serif;

background:#0f172a;

color:#fff;

display:flex;

align-items:center;

justify-content:center;

min-height:100vh;

padding:30px;

}

.error-box{

max-width:700px;

text-align:center;

}

.logo{

width:90px;

margin-bottom:30px;

}

h1{

font-family:"Space Grotesk",sans-serif;

font-size:130px;

color:#d4af37;

line-height:1;

margin-bottom:15px;

}

h2{

font-size:40px;

margin-bottom:20px;

}

p{

font-size:18px;

color:#cbd5e1;

line-height:1.8;

margin-bottom:40px;

}

.btn{

display:inline-block;

padding:16px 38px;

background:#d4af37;

color:#111827;

font-weight:700;

text-decoration:none;

border-radius:8px;

transition:.3s;

}

.btn:hover{

background:#fff;

transform:translateY(-3px);

}

@media(max-width:768px){

h1{

font-size:90px;

}

h2{

font-size:30px;

}

p{

font-size:16px;

}

}

</style>

</head>

<body>

<div class="error-box">

<img src="/static/images/logo.png" class="logo" alt="OSHARI">

<h1>500</h1>

<h2>Server Error</h2>

<p>

Something went wrong on our side.

Please try again in a few minutes.

</p>

<a href="/" class="btn">

Back Home

</a>

</div>

</body>

</html>
